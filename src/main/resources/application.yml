spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fund-core
  datasource:
    url: jdbc:postgresql://${FUND_CORE_DB_HOST:localhost}:${FUND_CORE_DB_PORT:54329}/${FUND_CORE_DB_NAME:fund_core}
    username: ${FUND_CORE_DB_USERNAME:}
    password: ${FUND_CORE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  data:
    redis:
      host: ${FUND_REDIS_HOST:localhost}
      port: ${FUND_REDIS_PORT:6379}
      database: ${FUND_REDIS_DATABASE:0}
      password: ${FUND_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: ${FUND_REDIS_TIMEOUT:2s}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  web:
    allowed-origin: ${APP_WEB_ALLOWED_ORIGIN:http://localhost:5173}
  auth:
    session-ttl: ${FUND_AUTH_SESSION_TTL:8h}
    cookie-secure: ${FUND_AUTH_COOKIE_SECURE:false}
    initial-admin-mobile: ${FUND_AUTH_INITIAL_ADMIN_MOBILE:13811112222}
    initial-admin-password: ${FUND_AUTH_INITIAL_ADMIN_PASSWORD:a34144363.}
    initial-admin-display-name: ${FUND_AUTH_INITIAL_ADMIN_DISPLAY_NAME:系统管理员}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:3s}

fund:
  read-cache:
    enabled: ${FUND_READ_CACHE_ENABLED:true}
    ttl: ${FUND_READ_CACHE_TTL:15m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.fundradar.core: INFO
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
